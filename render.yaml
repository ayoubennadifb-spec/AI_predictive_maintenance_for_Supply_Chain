services:
  - type: web
    name: parts-forecasting-app
    env: python
    plan: free
    autoDeploy: true

    buildCommand: |
      pip install -r backend/requirements.txt
      cd "webapp/UI for forecasting2"
      npm install
      npm run build

    startCommand: |
      cd backend && python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT

    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20
