services:
  - type: web
    name: efaix-predictive-maintenance-demo
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && cd "webapp/UI for forecasting2" && npm ci && npm run build
    startCommand: cd backend && python manage.py migrate --noinput && python ../portfolio_seed.py && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 2
    envVars:
      - key: PORTFOLIO_DEMO
        value: "1"
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: "20"
      - key: DJANGO_SECRET_KEY
        generateValue: true
