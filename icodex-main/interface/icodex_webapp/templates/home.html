<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/icodex_logo.svg?v=2" />
  <link rel="stylesheet" href="/static/main.css">
  <title>ICodex Model</title>
</head>
<body class="page">
  <header class="topbar">
    <a class="brand" href="/">
      <img class="brand-logo" src="/icodex_logo_full.svg" alt="ICODEX MODEL" />
    </a>
  </header>

  <main class="grid">
    <section class="card">
      <h2>Create account</h2>
      <form method="post" action="/signup" class="form">
        <label>Full name <input name="full_name" required></label>
        <label>Email <input name="email" type="email" required></label>
        <label>Password <input name="password" type="password" required></label>
        <label>Role
          <select name="role" required>
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
            <option value="admin">Admin</option>
          </select>
        </label>
        <label>School/University <input name="school" placeholder="Optional"></label>
        <label>Country <input name="country" placeholder="Optional"></label>
        <button type="submit">Sign up</button>
      </form>
    </section>

    <section class="card">
      <h2>Login</h2>
      <form method="post" action="/login" class="form">
        <label>Email <input name="email" type="email" required></label>
        <label>Password <input name="password" type="password" required></label>
        <button type="submit">Login</button>
      </form>
    </section>
  </main>
</body>
</html>
